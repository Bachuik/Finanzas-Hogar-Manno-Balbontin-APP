<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Finanzas Manno-Balbontín"/>
<title>Finanzas Manno-Balbontín</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a0a0a;font-family:'DM Sans',sans-serif;color:#f1f5f9}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
button{-webkit-tap-highlight-color:transparent;cursor:pointer}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:#0f0f0f}
.screen{min-height:100vh;display:flex;flex-direction:column;background:#0f0f0f}
/* Header */
.header{background:linear-gradient(160deg,#1a1a2e,#16213e);padding:20px 16px 16px;border-bottom:1px solid #1e293b}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.app-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;letter-spacing:-0.5px}
.month-picker{background:#1e293b;color:#94a3b8;border:1px solid #334155;border-radius:8px;padding:6px 10px;font-size:13px;font-family:'DM Sans',sans-serif}
.balance-card{background:rgba(255,255,255,.04);border-radius:16px;padding:16px 20px;border:1px solid rgba(255,255,255,.08)}
.balance-label{font-size:12px;color:#64748b;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.balance-amount{font-family:'Syne',sans-serif;font-size:36px;font-weight:800;letter-spacing:-1px;margin-bottom:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip-green{background:rgba(74,222,128,.12);color:#4ade80;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600}
.chip-red{background:rgba(248,113,113,.12);color:#f87171;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600}
.chip-purple{background:rgba(129,140,248,.15);color:#a5b4fc;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600}
/* FABs */
.fab-row{display:flex;gap:10px;padding:12px 16px;background:#0f0f0f}
.fab{flex:1;padding:13px 6px;border-radius:14px;border:none;font-size:13px;font-weight:700;font-family:'Syne',sans-serif;letter-spacing:-.3px}
.fab-red{background:#f87171;color:#111}
.fab-green{background:#4ade80;color:#111}
.fab-purple{background:#818cf8;color:#111}
/* Tabs */
.tabs{display:flex;background:#0f0f0f;padding:0 16px;border-bottom:1px solid #1e293b}
.tab{flex:1;padding:12px 4px;background:transparent;border:none;color:#64748b;font-size:13px;font-weight:600;border-bottom:2px solid transparent}
.tab.active{color:#f1f5f9;border-bottom:2px solid #6366f1}
.content{flex:1;overflow-y:auto;padding:8px 16px 80px}
/* Category row */
.cat-row{padding:12px 0;border-bottom:1px solid #1e293b}
.cat-top{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.cat-emoji{font-size:18px}
.cat-name{font-size:14px;color:#cbd5e1;font-weight:500}
.cuota-tag{font-size:11px;color:#a5b4fc;background:rgba(129,140,248,.12);border-radius:10px;padding:2px 8px}
.cat-nums{display:flex;justify-content:space-between;margin-bottom:6px}
.cat-amount{font-size:15px;font-weight:700}
.cat-pct{font-size:13px;color:#64748b}
.bar-bg{height:4px;background:#1e293b;border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
/* Medio section */
.section-title{font-size:13px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-top:24px;margin-bottom:4px;padding-top:16px;border-top:1px solid #1e293b}
.section-note{font-size:11px;color:#475569;margin-bottom:12px}
/* Lisandro */
.lisandro-box{margin-top:24px;background:#0f172a;border:1px solid #1e3a5f;border-radius:16px;padding:16px;border-top:2px solid #1e40af}
.lisandro-title{font-size:13px;font-weight:700;color:#60a5fa;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
.lis-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lis-label{font-size:14px;color:#94a3b8}
.lis-value{font-size:15px;font-weight:600;color:#e2e8f0}
.lis-input-wrap{display:flex;align-items:center;gap:4px;background:#1e293b;border-radius:8px;padding:6px 10px;border:1px solid #334155}
.lis-input-wrap span{color:#64748b;font-size:14px}
.lis-input{background:transparent;border:none;color:#f1f5f9;font-size:15px;font-weight:600;width:110px;outline:none;text-align:right;font-family:'DM Sans',sans-serif}
.lis-divider{height:1px;background:#1e3a5f;margin:10px 0}
.lis-result{font-size:18px;font-weight:800}
/* Sub tabs */
.sub-tabs{display:flex;gap:8px;margin-bottom:12px;margin-top:4px}
.sub-tab{flex:1;padding:10px 8px;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#64748b;font-size:13px;font-weight:600;text-align:center}
.sub-tab.egreso.active{background:rgba(248,113,113,.12);border-color:#f87171;color:#f87171}
.sub-tab.ingreso.active{background:rgba(74,222,128,.12);border-color:#4ade80;color:#4ade80}
/* Tx row */
.tx-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #1a1a2e}
.tx-emoji{font-size:22px;width:32px;text-align:center;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-label{display:block;font-size:14px;font-weight:500;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{display:block;font-size:12px;color:#475569;margin-top:2px}
.tx-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tx-amount{font-size:14px;font-weight:700}
.del-btn{background:transparent;border:none;font-size:13px;color:#475569;padding:2px 4px}
.del-confirm{background:#7f1d1d;border:none;color:#fca5a5;font-size:11px;font-weight:600;border-radius:6px;padding:3px 7px}
/* Cuota card */
.cuota-card{background:#13131f;border:1px solid #1e293b;border-radius:14px;padding:14px;margin-bottom:10px}
.cuota-summary{background:linear-gradient(135deg,#1e1b4b,#312e81);border-radius:14px;padding:16px;margin-bottom:16px;text-align:center}
.cuota-summary-label{font-size:12px;color:#a5b4fc;margin-bottom:4px}
.cuota-summary-amount{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:#e0e7ff;margin-bottom:4px}
/* Form */
.form-header{padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #2d1b3d}
.back-btn{background:transparent;border:none;color:#94a3b8;font-size:14px;padding:4px 0}
.form-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:800}
.form-body{flex:1;overflow-y:auto;padding:16px 16px 80px}
.section{margin-bottom:24px}
.section-label{font-size:13px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.optional{font-weight:400;text-transform:none;color:#475569;font-size:12px}
.date-row{display:flex;gap:8px}
.date-btn{flex:1;padding:10px 6px;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#94a3b8;font-size:13px;font-weight:600}
.date-btn.active{background:#312e81;border-color:#6366f1;color:#a5b4fc}
.date-input{width:100%;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#f1f5f9;padding:10px 12px;font-size:14px;font-family:'DM Sans',sans-serif;margin-top:10px}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat-btn{padding:10px 4px;background:#1a1a2e;border:1.5px solid #1e293b;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.cat-btn.selected{transform:scale(1.05)}
.cat-btn-emoji{font-size:22px}
.cat-btn-label{font-size:10px;color:#94a3b8;font-weight:600;text-align:center;line-height:1.2}
.inc-cat-btn{padding:10px 4px;background:#0f2918;border:1.5px solid #14532d;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.inc-cat-btn.selected{background:#14532d;border-color:#16a34a;transform:scale(1.05)}
.amount-wrap{display:flex;align-items:center;background:#1e293b;border-radius:14px;border:1px solid #334155;padding:4px 16px}
.amount-prefix{font-size:28px;color:#475569;font-weight:700;margin-right:8px}
.amount-input{flex:1;background:transparent;border:none;color:#f1f5f9;font-size:32px;font-family:'Syne',sans-serif;font-weight:800;outline:none;width:100%}
.medio-row{display:flex;flex-wrap:wrap;gap:8px}
.medio-btn{padding:8px 14px;background:#1e293b;border:1px solid #334155;border-radius:20px;color:#94a3b8;font-size:13px;font-weight:600}
.medio-btn.active{background:#312e81;border-color:#6366f1;color:#a5b4fc}
.detail-input{width:100%;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#f1f5f9;padding:12px 14px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none}
.save-btn{width:100%;padding:16px;border:none;border-radius:14px;color:#fff;font-size:16px;font-weight:700;font-family:'Syne',sans-serif;margin-top:8px;letter-spacing:-.3px}
.save-btn:disabled{opacity:.35}
.saved-banner{text-align:center;padding:10px;font-size:14px;font-weight:700}
.cuota-opts{display:flex;flex-wrap:wrap;gap:8px}
.cuota-opt{padding:10px 16px;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#94a3b8;font-size:14px;font-weight:700}
.cuota-opt.active{background:#312e81;border-color:#6366f1;color:#a5b4fc}
.cuota-preview{margin-top:12px;background:rgba(99,102,241,.1);border:1px solid #312e81;border-radius:10px;padding:10px 14px;text-align:center}
.empty{color:#475569;text-align:center;padding:40px 0;font-size:14px}
</style>
</head>

    else if(k==="style" && typeof v==="object") Object.assign(e.style,v);

// ── STORAGE (Supabase)
async function loadData() {
  try {
    // Load transactions
    const { data: txData } = await _supa.from("transactions").select("*");
    if(txData && txData.length > 0) {
      const remapped = txData.map(r => ({
        id: r.id, type: r.type, date: r.date,
        category: r.category, amount: r.amount,
        medio: r.medio, detail: r.detail
      }));
      state.transactions = [...SEED_DATA, ...remapped];
    } else {
      state.transactions = [...SEED_DATA];
    }
    // Load cuotas
    const { data: cuotaData } = await _supa.from("cuotas").select("*");
    if(cuotaData) {
      state.cuotas = cuotaData.map(r => ({
        id: r.id, category: r.category,
        totalAmount: r.total_amount, totalCuotas: r.total_cuotas,
        medio: r.medio, detail: r.detail, startMonth: r.start_month
      }));
    }
    // Load lisandro
    const { data: lisData } = await _supa.from("lisandro").select("*");
    if(lisData) {
      const obj = {};
      lisData.forEach(r => { obj[r.month] = { monto: r.monto, pagado: r.pagado }; });
      state.lisandroData = obj;
    }
  } catch(e) {
    console.error("Error loading data:", e);
    state.transactions = [...SEED_DATA];
  }
  render();
}

async function saveTx() {
  const newTxs = state.transactions.filter(t=>t.id>1700000000500);
  if(newTxs.length > 0) {
    const rows = newTxs.map(t => ({
      id: Math.floor(t.id), 
      type: t.type, 
      date: t.date,
      category: t.category, 
      amount: t.amount,
      medio: t.medio||null, 
      detail: t.detail||null
    }));
    const {error} = await _supa.from("transactions").upsert(rows);
    if(error) console.error("Supabase saveTx error:", error.message, error);
  }
}

async function saveCuotas() {
  // Delete all and reinsert
  await _supa.from("cuotas").delete().gt("id", 0);
  if(state.cuotas.length > 0) {
    await _supa.from("cuotas").upsert(
      state.cuotas.map(c => ({

        medio: c.medio||null, detail: c.detail||null,
        start_month: c.startMonth
      }))

}

async function saveLisandro() {
  const rows = Object.entries(state.lisandroData).map(([month, v]) => ({
    month, monto: v.monto||0, pagado: v.pagado||false
  }));
  if(rows.length > 0) {
    await _supa.from("lisandro").upsert(rows);
  }
}

// ── CUOTA DETECTION
function detectCuota(detail) {
  if(!detail) return null;
  const match = detail.match(/(\d+)\/(\d+)/);
  if(!match) return null;
  const current=parseInt(match[1]), total=parseInt(match[2]);
  if(total<=1||current>total) return null;
  return {current,total};
}

function getInferredCuotas(transactions) {
  const groups={};
  (transactions||[]).filter(t=>t.type==="expense"&&monthKey(t.date)>="2026-06").forEach(t=>{
    const cuota=detectCuota(t.detail);
    if(!cuota) return;
    const baseName=(t.detail||"").replace(/(\d+)\/(\d+)/,"").replace(/[()]/g,"").trim();
    const key=baseName+"|"+t.category+"|"+(t.medio||"");
    if(!groups[key]) groups[key]={baseName,category:t.category,medio:t.medio,total:cuota.total,entries:[]};
    groups[key].entries.push({...t,cuotaNum:cuota.current});
  });
  return Object.values(groups).filter(g=>{
    const maxPaid=Math.max(...g.entries.map(e=>e.cuotaNum));
    return maxPaid<g.total;
  }).map(g=>{
    const maxPaid=Math.max(...g.entries.map(e=>e.cuotaNum));
    const lastEntry=g.entries.find(e=>e.cuotaNum===maxPaid);
    return {...g,maxPaid,remaining:g.total-maxPaid,amount:lastEntry?.amount||0};
  }).sort((a,b)=>b.remaining-a.remaining);
}

// ── COMPUTED
function getCuotasForMonth(ym) {
  return state.cuotas.flatMap(c => {
    const res=[];
    for(let i=0;i<c.totalCuotas;i++)
      if(addMonths(c.startMonth,i)===ym)
        res.push({...c,cuotaNum:i+1,amount:Math.round(c.totalAmount/c.totalCuotas),type:"expense",isCuota:true,id:c.id+i*0.1});
    return res;
  });
}

function getMonthData(ym) {
  const monthTxs = state.transactions.filter(t=>monthKey(t.date)===ym);
  const monthCuotas = getCuotasForMonth(ym);
  const totalIncome = monthTxs.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  const totalCuotas = monthCuotas.reduce((s,c)=>s+c.amount,0);
  const totalExpense = monthTxs.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0)+totalCuotas;
  const balance = totalIncome-totalExpense;
  const impuestosTotal = monthTxs.filter(t=>t.type==="expense"&&t.category==="impuestos").reduce((s,t)=>s+t.amount,0);
  const catBreakdown = EXPENSE_CATS.map(c=>{
    const fromTx=monthTxs.filter(t=>t.type==="expense"&&t.category===c.id).reduce((s,t)=>s+t.amount,0);
    const fromCuotas=monthCuotas.filter(q=>q.category===c.id).reduce((s,q)=>s+q.amount,0);
    return {...c,total:fromTx+fromCuotas,fromCuotas};
  }).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);
  const allExpenses=[...monthTxs.filter(t=>t.type==="expense"),...monthCuotas];
  const medioTotals={};
  allExpenses.forEach(t=>{ const m=t.medio||"Efectivo"; medioTotals[m]=(medioTotals[m]||0)+t.amount; });
  const medios=Object.entries(medioTotals).sort((a,b)=>b[1]-a[1]);
  return {monthTxs,monthCuotas,totalIncome,totalCuotas,totalExpense,balance,impuestosTotal,catBreakdown,medios};
}

function getAllMonths() {
  const months=[...new Set([
    ...state.transactions.map(t=>monthKey(t.date)),
    ...state.cuotas.flatMap(c=>Array.from({length:c.totalCuotas},(_,i)=>addMonths(c.startMonth,i)))
  ])].filter(Boolean).sort().reverse();
  if(!months.includes(currentMonth())) months.unshift(currentMonth());
  return months;
}

// ── RENDER ENGINE
let app;
function render() {
  const root = document.getElementById("app");
  const newApp = buildView();
  if(!newApp) return;
  if(app && app.parentNode === root) {
    root.replaceChild(newApp, app);
  } else {
    root.innerHTML = "";
    root.appendChild(newApp);
  }
  app = newApp;
}

function setState(updates, rerender=true) {
  Object.assign(state,updates);
  if(rerender) render();
}

function buildView() {
  switch(state.view) {
    case "home":       return buildHome();
    case "addExpense": return buildAddExpense();
    case "addIncome":  return buildAddIncome();
    case "addCuota":   return buildAddCuota();
    case "addTarjeta": return buildAddTarjeta();
    case "editTx":     return buildEditTx();
  }
}

function buildMovimientos(monthTxs,monthCuotas) {
  const all=[...monthTxs.map(t=>({...t,isCuota:false})),...monthCuotas].sort((a,b)=>(b.id||0)-(a.id||0));

  const label=tx.isCuota?`${tx.detail||cat?.label||tx.category} (${tx.cuotaNum}/${tx.totalCuotas})`:(tx.detail||cat?.label||tx.category||"");
  const amtColor=tx.type==="income"?"#4ade80":"#f87171";
  const amtTxt=(tx.type==="income"?"+":"−")+fmtMoney(tx.amount);

  const right=h("div",{class:"tx-right"},h("span",{class:"tx-amount",style:{color:amtColor}},amtTxt));
  if(!tx.isCuota) {
    // Edit button
    const editBtn = h("button",{style:{background:"transparent",border:"none",fontSize:"13px",cursor:"pointer",color:"#6366f1",padding:"2px 4px"},
      onclick:()=>setState({view:"editTx",editTx:{...tx}})
    },"✏️");
    right.appendChild(editBtn);
    // Delete button
    const delBtn=h("button",{class:"del-btn",onclick:()=>{
      if(state.confirmDelete===tx.id) {
        const deleted=state.transactions.find(t=>t.id===tx.id);
        state.transactions=state.transactions.filter(t=>t.id!==tx.id);
        if(deleted&&deleted.id>1700000000500) _supa.from("transactions").delete().eq("id",deleted.id).then(()=>{});
        state.confirmDelete=null; render();
      } else { setState({confirmDelete:tx.id}); }
    }},state.confirmDelete===tx.id?"✓ Borrar":"🗑");
    if(state.confirmDelete===tx.id) delBtn.className="del-confirm";
    right.appendChild(delBtn);
  }
  return h("div",{class:"tx-row"},
    h("span",{class:"tx-emoji"},tx.isCuota?"🔁":cat?.emoji||"💸"),
    h("div",{class:"tx-info"},h("span",{class:"tx-label"},label),h("span",{class:"tx-meta"},fmtDate(tx.date)+(tx.medio?` · ${tx.medio}`:""))),
    right

// ── ADD EXPENSE
function buildAddExpense() {
  const f=state.exp;
  const onSave=()=>{
    if(!f.cat||!f.amount) return;
    const date=f.dateMode==="today"?todayStr():f.dateMode==="yesterday"?yesterdayStr():f.customDate;
    state.transactions.push({type:"expense",category:f.cat.id,amount:parseInt(f.amount),medio:f.medio,detail:f.detail,date,id:Date.now()});
    saveTx().catch(e=>console.error(e));
    // Reset form fields after 3s so user can keep adding
    setTimeout(()=>{
      state.exp={cat:null,amount:"",medio:"Efectivo",detail:"",dateMode:"today",customDate:todayStr(),saved:false};
      render();
    }, 1100);
  };
  return buildForm({
    headerBg:"#1a0a1e", title:"Nuevo Gasto", savedBg:"#14532d", savedColor:"#4ade80",
    saved:f.saved, onBack:()=>setState({view:"home",exp:{...state.exp,saved:false}}),
    body: [
      buildFormDate(f,"exp"),
      buildCatGrid(f,"exp",EXPENSE_CATS,"cat-btn"),

      buildSaveBtn("Guardar gasto","#dc2626",()=>!state.exp.cat||!state.exp.amount,onSave)

  });
}

function buildAddIncome() {
  const f=state.inc;
  const onSave=()=>{
    if(!f.cat||!f.amount) return;
    const date=f.dateMode==="today"?todayStr():f.dateMode==="yesterday"?yesterdayStr():f.customDate;
    state.transactions.push({type:"income",category:f.cat.id,amount:parseInt(f.amount),detail:f.detail,date,id:Date.now()});
    saveTx().catch(e=>console.error(e));
    setTimeout(()=>{
      state.inc={cat:null,amount:"",detail:"",dateMode:"today",customDate:todayStr(),saved:false};
      render();
    }, 1100);
  };
  return buildForm({
    headerBg:"#052e16", title:"Nuevo Ingreso", savedBg:"#166534", savedColor:"#4ade80",
    saved:f.saved, onBack:()=>setState({view:"home",inc:{...state.inc,saved:false}}),
    body: [
      buildFormDate(f,"inc"),
      buildCatGrid(f,"inc",INCOME_CATS,"inc-cat-btn"),
      buildAmountInput(f,"inc"),
      buildDetailInput(f,"inc","ej: Sueldo mayo..."),
      buildSaveBtn("Guardar ingreso","#16a34a",()=>!state.inc.cat||!state.inc.amount,onSave)
    ]
  });
}

// ── ADD CUOTA
function buildAddCuota() {
  const f=state.cuotaForm;
  const cuotaAmt = f.total&&f.numCuotas?Math.round(parseInt(f.total)/f.numCuotas):0;
  const onSave=()=>{
    if(!f.cat||!f.total) return;
    state.cuotas.push({category:f.cat.id,totalAmount:parseInt(f.total),totalCuotas:f.numCuotas,medio:f.medio,detail:f.detail,startMonth:f.startMonth,id:Date.now()});
    saveCuotas().catch(e=>console.error(e));
    setTimeout(()=>{
      state.cuotaForm={cat:null,total:"",numCuotas:3,medio:"Visa",detail:"",startMonth:currentMonth(),saved:false};
      render();
    }, 1100);
  };

  const cuotaOpts=h("div",{});
  const cuotaOptsRow=h("div",{class:"cuota-opts"});
  CUOTA_OPTS.forEach(n=>{
    const btn=h("button",{class:"cuota-opt"+(f.numCuotas===n?" active":""),onclick:()=>{ state.cuotaForm.numCuotas=n; render(); }},n+"x");
    cuotaOptsRow.appendChild(btn);
  });
  cuotaOpts.appendChild(cuotaOptsRow);
  if(cuotaAmt>0) cuotaOpts.appendChild(h("div",{class:"cuota-preview"},h("span",{style:{color:"#a5b4fc",fontWeight:"700"}},fmtMoney(cuotaAmt)+"/mes"),h("span",{style:{color:"#64748b",fontSize:"12px"}}," durante "+f.numCuotas+" meses")));

  const monthInput=h("input",{type:"month",class:"date-input",style:{marginTop:"0"},value:f.startMonth});
  monthInput.addEventListener("change",e=>{ state.cuotaForm.startMonth=e.target.value; render(); });

  return buildForm({
    headerBg:"#1e1b4b", title:"Nueva Compra en Cuotas", savedBg:"#3730a3", savedColor:"#a5b4fc",
    saved:f.saved, onBack:()=>setState({view:"home",cuotaForm:{...state.cuotaForm,saved:false}}),
    body: [
      buildCatGrid(f,"cuotaForm",EXPENSE_CATS,"cat-btn"),
      buildAmountInput(f,"cuotaForm","Monto total de la compra","total"),
      h("div",{class:"section"},h("div",{class:"section-label"},"Cantidad de cuotas"),cuotaOpts),
      h("div",{class:"section"},h("div",{class:"section-label"},"Primera cuota en"),monthInput),
      buildMedioInput(f,"cuotaForm"),
      buildDetailInput(f,"cuotaForm","ej: Zapatillas, TV Samsung..."),
      buildSaveBtn("Registrar cuotas","#4f46e5",()=>!state.cuotaForm.cat||!state.cuotaForm.total,onSave)
    ]
  });
}

// ── FORM HELPERS
function buildForm({headerBg,title,savedBg,savedColor,saved,onBack,body}) {
  const header=h("div",{class:"form-header",style:{background:headerBg}},
    h("button",{class:"back-btn",onclick:onBack},"← Volver"),
    h("span",{class:"form-title"},title)
  );
  const banner=h("div",{class:"saved-banner",style:{background:savedBg,color:savedColor,display:saved?"block":"none"}},"✓ Guardado");
  const formBody=h("div",{class:"form-body"},...body);
  return h("div",{class:"screen"},header,banner,formBody);
}

function buildFormDate(f,key) {
  const wrap=h("div",{class:"section"});
  wrap.appendChild(h("div",{class:"section-label"},"¿Cuándo?"));
  const row=h("div",{class:"date-row"});
  [["today","Hoy"],["yesterday","Ayer"],["custom","Otra fecha"]].forEach(([m,lbl])=>{
    row.appendChild(h("button",{class:"date-btn"+(f.dateMode===m?" active":""),onclick:()=>{ state[key].dateMode=m; render(); }},lbl));
  });
  wrap.appendChild(row);
  if(f.dateMode==="custom"){
    const inp=h("input",{type:"date",class:"date-input",value:f.customDate});
    inp.addEventListener("change",e=>{ state[key].customDate=e.target.value; render(); });
    wrap.appendChild(inp);
  }
  return wrap;
}

function buildCatGrid(f,key,cats,btnClass) {
  const wrap=h("div",{class:"section"});
  wrap.appendChild(h("div",{class:"section-label"},"¿En qué?"));
  const grid=h("div",{class:"cat-grid"});
  cats.forEach(c=>{
    const isSelected = state[key].cat?.id===c.id;
    const btn=h("button",{class:btnClass+(isSelected?" selected":""),onclick:()=>{ state[key].cat=c; render(); }},
      h("span",{class:"cat-btn-emoji"},c.emoji),
      h("span",{class:"cat-btn-label"},c.label)
    );
    btn.style.border = "1.5px solid "+(isSelected?(c.color||"#6366f1"):"#1e293b");
    if(isSelected) btn.style.background=(c.color||"#6366f1")+"33";
    grid.appendChild(btn);
  });
  wrap.appendChild(grid);
  return wrap;
}

function buildAmountInput(f,key,label="¿Cuánto?",field="amount") {
  const wrap=h("div",{class:"section"});
  wrap.appendChild(h("div",{class:"section-label"},label));
  const inp=h("input",{type:"number",inputmode:"numeric",class:"amount-input",placeholder:"0",value:f[field]||""});
  inp.addEventListener("input",e=>{ state[key][field]=e.target.value; });
  wrap.appendChild(h("div",{class:"amount-wrap"},h("span",{class:"amount-prefix"},"$"),inp));
  return wrap;
}

function buildMedioInput(f,key) {
  const wrap=h("div",{class:"section"});
  wrap.appendChild(h("div",{class:"section-label"},"¿Con qué?"));
  const row=h("div",{class:"medio-row"});
  MEDIOS.forEach(m=>{
    row.appendChild(h("button",{class:"medio-btn"+(f.medio===m?" active":""),onclick:()=>{ state[key].medio=m; render(); }},m));
  });
  wrap.appendChild(row);
  return wrap;
}

function buildDetailInput(f,key,placeholder) {
  const wrap=h("div",{class:"section"});
  wrap.appendChild(h("div",{class:"section-label"},"Detalle ",h("span",{class:"optional"},"(opcional)")));
  const inp=h("input",{type:"text",class:"detail-input",placeholder});
  inp.value=f.detail||"";
  inp.addEventListener("input",e=>{ state[key].detail=e.target.value; });
  wrap.appendChild(inp);
  return wrap;
}

function buildSaveBtn(label,bg,disabledOrFn,onClick) {
  let saving = false;
  const getDisabled = typeof disabledOrFn === "function" ? disabledOrFn : () => disabledOrFn;
  const btn = h("button",{class:"save-btn",style:{background:bg,opacity:"1",transition:"opacity 0.15s"}},label);
  btn.onclick = () => {
    if(saving) return;
    const isDisabled = getDisabled();
    if(isDisabled) {
      btn.style.background = "#475569";
      setTimeout(()=>{ btn.style.background = bg; }, 400);
      return;
    }
    saving = true;
    onClick();
    btn.textContent = "✓ Listo";
    btn.style.background = "#16a34a";
    btn.style.opacity = "1";
    setTimeout(()=>{
      btn.textContent = label;
      btn.style.background = bg;
      saving = false;
    }, 1000);
  };
  return btn;
}

// ── ADD TARJETA
function buildAddTarjeta() {
  const f = state.tarjetaForm;
  if(!f.customDate) f.customDate = todayStr();
  const total = f.items.reduce((s,i)=>s+i.amount,0);

  const wrap = h("div",{class:"screen"});

  // Header
  wrap.appendChild(h("div",{class:"form-header",style:{background:"#1a1200"}},
    h("button",{class:"back-btn",onclick:()=>setState({view:"home"})},"← Volver"),
    h("span",{class:"form-title"},"💳 Carga por Tarjeta")
  ));

  const body = h("div",{class:"form-body"});

  // Medio selector
  const medioSection = h("div",{class:"section"});
  medioSection.appendChild(h("div",{class:"section-label"},"¿Qué tarjeta?"));
  const medioRow = h("div",{class:"medio-row"});
  MEDIOS.forEach(m=>{
    const btn = h("button",{class:"medio-btn"+(f.medio===m?" active":""),onclick:()=>{ state.tarjetaForm.medio=m; render(); }},m);
    medioRow.appendChild(btn);
  });
  medioSection.appendChild(medioRow);
  body.appendChild(medioSection);

  // Fecha
  body.appendChild(buildFormDate(f,"tarjetaForm"));

  // Items list
  if(f.items.length > 0) {
    const listSection = h("div",{class:"section"});
    listSection.appendChild(h("div",{class:"section-label"},"Items cargados"));
    f.items.forEach((item,idx)=>{
      const cat = EXPENSE_CATS.find(c=>c.id===item.category);
      const row = h("div",{style:{display:"flex",alignItems:"center",gap:"8px",padding:"10px 0",borderBottom:"1px solid #1e293b"}},
        h("span",{style:{fontSize:"20px"}},cat?.emoji||"💸"),
        h("div",{style:{flex:"1",minWidth:"0"}},
          h("span",{style:{display:"block",fontSize:"14px",fontWeight:"500",color:"#e2e8f0"}},item.detail||cat?.label||""),
          h("span",{style:{display:"block",fontSize:"12px",color:"#475569"}},cat?.label||"")
        ),
        h("span",{style:{fontSize:"14px",fontWeight:"700",color:"#f87171"}},fmtMoney(item.amount)),
        h("button",{style:{background:"transparent",border:"none",color:"#475569",fontSize:"13px",cursor:"pointer"},onclick:()=>{
          state.tarjetaForm.items = state.tarjetaForm.items.filter((_,i)=>i!==idx);
          render();
        }},"🗑")
      );
      listSection.appendChild(row);
    });
    // Total
    listSection.appendChild(h("div",{style:{display:"flex",justifyContent:"space-between",padding:"12px 0",marginTop:"4px"}},
      h("span",{style:{fontSize:"15px",fontWeight:"700",color:"#f1f5f9"}},"Total"),
      h("span",{style:{fontSize:"15px",fontWeight:"800",color:"#f59e0b"}},fmtMoney(total))
    ));
    body.appendChild(listSection);
  }

  // Add item section
  const addSection = h("div",{class:"section"});
  addSection.appendChild(h("div",{class:"section-label"},f.items.length===0?"Agregá el primer ítem":"Agregar otro ítem"));

  // Mini cat grid
  const catGrid = h("div",{class:"cat-grid",style:{marginBottom:"12px"}});
  EXPENSE_CATS.forEach(c=>{
    const isSelected = state.tarjetaForm.newCat?.id===c.id;
    const btn = h("button",{class:"cat-btn"+(isSelected?" selected":""),onclick:()=>{ state.tarjetaForm.newCat=c; render(); }},
      h("span",{class:"cat-btn-emoji"},c.emoji),
      h("span",{class:"cat-btn-label"},c.label)
    );
    btn.style.border = "1.5px solid "+(isSelected?(c.color||"#6366f1"):"#1e293b");
    if(isSelected) btn.style.background=(c.color||"#6366f1")+"33";
    catGrid.appendChild(btn);
  });
  addSection.appendChild(catGrid);

  // Amount input for new item
  const amtWrap = h("div",{class:"amount-wrap",style:{marginBottom:"12px"}});
  amtWrap.appendChild(h("span",{class:"amount-prefix"},"$"));
  const amtInput = h("input",{type:"number",inputmode:"numeric",class:"amount-input",placeholder:"0",value:f.newAmount||""});
  amtInput.addEventListener("input",e=>{ state.tarjetaForm.newAmount=e.target.value; });
  amtWrap.appendChild(amtInput);
  addSection.appendChild(amtWrap);

  // Detail input for new item
  const detailInput = h("input",{type:"text",class:"detail-input",style:{marginBottom:"12px"},placeholder:"Detalle (opcional)",value:f.newDetail||""});
  detailInput.addEventListener("input",e=>{ state.tarjetaForm.newDetail=e.target.value; });
  addSection.appendChild(detailInput);

  // Add item button
  const addBtn = h("button",{style:{width:"100%",padding:"12px",background:"#1e293b",border:"1px solid #334155",borderRadius:"12px",color:"#94a3b8",fontSize:"14px",fontWeight:"600",cursor:"pointer",marginBottom:"8px"},
    onclick:()=>{
      const cat = state.tarjetaForm.newCat;
      const amt = parseInt(state.tarjetaForm.newAmount||"0");
      if(!cat||!amt) return;
      state.tarjetaForm.items.push({category:cat.id,amount:amt,detail:state.tarjetaForm.newDetail||""});
      state.tarjetaForm.newCat=null;
      state.tarjetaForm.newAmount="";
      state.tarjetaForm.newDetail="";
      render();
    }},"+ Agregar ítem");
  addSection.appendChild(addBtn);
  body.appendChild(addSection);

  // Save all button
  if(f.items.length > 0) {
    let saving = false;
    const saveBtn = h("button",{class:"save-btn",style:{background:"#f59e0b",color:"#111"}},
      `Guardar ${f.items.length} gasto${f.items.length>1?"s":""} · ${fmtMoney(total)}`
    );
    saveBtn.onclick = () => {
      if(saving) return;
      saving = true;
      const date = f.dateMode==="today"?todayStr():f.dateMode==="yesterday"?yesterdayStr():f.customDate;
      const baseId = Date.now();
      f.items.forEach((item,idx)=>{
        state.transactions.push({type:"expense",category:item.category,amount:item.amount,medio:f.medio,detail:item.detail,date,id:baseId+idx});
      });
      saveTx().catch(e=>console.error(e));
      saveBtn.textContent = "✓ Listo";
      saveBtn.style.background = "#16a34a";
      setTimeout(()=>{
        state.tarjetaForm={medio:null,dateMode:"today",customDate:todayStr(),items:[],newCat:null,newAmount:"",newDetail:""};
        setState({view:"home"});
      },1000);
    };
    body.appendChild(saveBtn);
  }

  wrap.appendChild(body);
  return wrap;
}

// ── EDIT TRANSACTION
function buildEditTx() {
  const tx = state.editTx;
  if(!tx) { setState({view:"home"}); return h("div",{}); }

  const isExpense = tx.type==="expense";
  const cats = isExpense ? EXPENSE_CATS : INCOME_CATS;
  let selCat = cats.find(c=>c.id===tx.category)||null;
  let amount = String(tx.amount||"");
  let medio = tx.medio||"Efectivo";
  let detail = tx.detail||"";
  let dateVal = tx.date||todayStr();

  const wrap = h("div",{class:"screen"});
  const headerBg = isExpense?"#1a0a1e":"#052e16";
  wrap.appendChild(h("div",{class:"form-header",style:{background:headerBg}},
    h("button",{class:"back-btn",onclick:()=>setState({view:"home",editTx:null})},"← Volver"),
    h("span",{class:"form-title"},"✏️ Editar movimiento")
  ));

  const body = h("div",{class:"form-body"});

  // Date
  const dateSection = h("div",{class:"section"});
  dateSection.appendChild(h("div",{class:"section-label"},"Fecha"));
  const dateInput = h("input",{type:"date",class:"date-input",value:dateVal});
  dateInput.addEventListener("change",e=>{ dateVal=e.target.value; });
  dateSection.appendChild(dateInput);
  body.appendChild(dateSection);

  // Category
  const catSection = h("div",{class:"section"});
  catSection.appendChild(h("div",{class:"section-label"},"Categoría"));
  const catGrid = h("div",{class:"cat-grid"});
  const catBtns = {};
  cats.forEach(c=>{
    const isSelected = c.id===tx.category;
    const btn = h("button",{class:"cat-btn"+(isSelected?" selected":""),onclick:()=>{
      selCat=c;
      Object.values(catBtns).forEach(b=>{ b.style.background="#1a1a2e"; b.style.borderColor="#1e293b"; });
      btn.style.background=(c.color||"#6366f1")+"33";
      btn.style.borderColor=c.color||"#6366f1";
    }},
      h("span",{class:"cat-btn-emoji"},c.emoji),
      h("span",{class:"cat-btn-label"},c.label)
    );
    if(isSelected){ btn.style.background=(c.color||"#6366f1")+"33"; btn.style.borderColor=c.color||"#6366f1"; }
    catBtns[c.id]=btn;
    catGrid.appendChild(btn);
  });
  catSection.appendChild(catGrid);
  body.appendChild(catSection);

  // Amount
  const amtSection = h("div",{class:"section"});
  amtSection.appendChild(h("div",{class:"section-label"},"Monto"));
  const amtInput = h("input",{type:"number",inputmode:"numeric",class:"amount-input",placeholder:"0",value:amount});
  amtInput.addEventListener("input",e=>{ amount=e.target.value; });
  amtSection.appendChild(h("div",{class:"amount-wrap"},h("span",{class:"amount-prefix"},"$"),amtInput));
  body.appendChild(amtSection);

  // Medio (expense only)
  if(isExpense) {
    const medioSection = h("div",{class:"section"});
    medioSection.appendChild(h("div",{class:"section-label"},"Medio de pago"));
    const medioRow = h("div",{class:"medio-row"});
    MEDIOS.forEach(m=>{
      const btn=h("button",{class:"medio-btn"+(medio===m?" active":""),onclick:()=>{
        medio=m;
        medioRow.querySelectorAll("button").forEach(b=>b.className="medio-btn");
        btn.className="medio-btn active";
      }},m);
      medioRow.appendChild(btn);
    });
    medioSection.appendChild(medioRow);
    body.appendChild(medioSection);
  }

  // Detail
  const detSection = h("div",{class:"section"});
  detSection.appendChild(h("div",{class:"section-label"},"Detalle ",h("span",{class:"optional"},"(opcional)")));
  const detInput = h("input",{type:"text",class:"detail-input",placeholder:"ej: Carrefour...",value:detail});
  detInput.addEventListener("input",e=>{ detail=e.target.value; });
  detSection.appendChild(detInput);
  body.appendChild(detSection);

  // Save button
  let saving=false;
  const saveBtn = h("button",{class:"save-btn",style:{background:isExpense?"#dc2626":"#16a34a"}},
    "Guardar cambios"
  );
  saveBtn.onclick = ()=>{
    if(saving) return;
    saving=true;
    const updated = {...tx, category:selCat?.id||tx.category, amount:parseInt(amount)||tx.amount, medio, detail, date:dateVal};
    state.transactions = state.transactions.map(t=>t.id===tx.id?updated:t);
    // Update in Supabase if it's a new tx
    if(tx.id>1700000000500) {
      _supa.from("transactions").upsert({
        id:Math.floor(tx.id),type:updated.type,date:updated.date,
        category:updated.category,amount:updated.amount,
        medio:updated.medio||null,detail:updated.detail||null
      }).then(({error})=>{ if(error) console.error("Edit error:",error.message); });
    }
    saveBtn.textContent="✓ Guardado";
    saveBtn.style.background="#16a34a";
    setTimeout(()=>setState({view:"home",editTx:null}),800);
  };
  body.appendChild(saveBtn);
  wrap.appendChild(body);
  return wrap;
}

loadData();
</script>
